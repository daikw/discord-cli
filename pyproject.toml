[project]
name = "kabi-discord-cli"
version = "0.2.8+daikw.2"
description = "Discord CLI for local-first sync, search, export, and agent-friendly retrieval"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "jackwener" }]
keywords = ["discord", "cli", "sqlite", "agent", "discord-cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
urls = { Homepage = "https://github.com/daikw/discord-cli", Repository = "https://github.com/daikw/discord-cli", Issues = "https://github.com/daikw/discord-cli/issues" }
dependencies = [
    "httpx==0.28.1",
    "click==8.3.1",
    "rich==14.3.3",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["build==1.4.0", "pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.5", "twine==6.2.0"]


[project.scripts]
discord = "discord_cli.cli.main:cli"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/discord_cli",
    "tests",
    "README.md",
    "README_CN.md",
    "SKILL.md",
    ".env.example",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100
